[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "liverswat-bench"
version = "0.1.0.dev0"
description = "An evidence-grounded AI safety benchmark for evaluating open-weight LLMs on UK liver health advice."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Taran Rai" }]
keywords = ["ai-safety", "llm-evaluation", "benchmark", "medical-ai", "truthfulness"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core dependencies are kept deliberately small so the benchmark can be
# validated and run without GPUs or paid APIs.
dependencies = [
    "pydantic>=2.6,<3",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Analysis stack (used from Milestone 3 onwards).
analysis = ["pandas>=2.1", "numpy>=1.26", "scipy>=1.11"]
# Local inference backends (used from Milestone 2 onwards).
hf = ["transformers>=4.40", "datasets>=2.18"]
vllm = ["vllm>=0.5"]
# Results synchronisation for the Hugging Face Space judge runner (Milestone 5).
space = ["huggingface_hub>=0.24"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
liverswat = "liverswat_bench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/liverswat_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
