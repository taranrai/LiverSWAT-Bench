name: Feature request
description: Propose a new feature or a change to the framework.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the research or software need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Effect on results
      description: State whether the change can affect scores, judge results or reproducibility.
