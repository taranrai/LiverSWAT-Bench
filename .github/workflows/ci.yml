name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Validate benchmark data
        run: liverswat validate
      - name: Test
        run: pytest
      - name: Mock model evaluation (no GPU, no API)
        run: |
          liverswat evaluate --model mock --dataset data/examples/demo_items.jsonl --experiment-id ci-mock-demo
          liverswat evaluate --model mock --dataset data/pilot/uk_cmo_pilot_items.jsonl --experiment-id ci-mock-pilot
